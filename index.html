<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap">
<style>
  /* Layout: hoja blanca, una columna, filetes finos de 1px. EB Garamond para todo; el acento azul solo marca lo activo. Sin sombras, cintas ni giros. */
  :root {
    --paper: #ffffff;
    --ink: #1a2130;
    --muted: #59627a;
    --line: #d3d9e4;
    --line2: #aeb7c8;
    --accent: #1f4f82;
    --c-ann: #a23d39;
    --accent-fg: #ffffff;
    --tint: rgba(47, 95, 143, .08);
    --warm: #7a4f0c;
    --stamp: #92362f;
    --st-have: #e7f1ea;
    --st-buy: #f6ecd2;
    --st-rent: #e3ecf5;
    --danger: #c93a35;
    --glass: rgba(255, 255, 255, .62); --glass2: rgba(255, 255, 255, .5); --glass-b: rgba(47, 70, 110, .16); --glass-sh: 0 12px 36px rgba(30, 45, 80, .16); --glass-hi: rgba(255, 255, 255, .85);
    --f-blue: #4f7fa8; --f-white: #eef1f5; --f-red: #b5483f; --f-green: #5aa076; --f-yellow: #d6a93d;
    --serif: "EB Garamond", Garamond, "Palatino Linotype", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12161d; --ink: #e9edf4; --muted: #aab3c3; --line: #343c4c; --line2: #4d586c;
      --accent: #a6cdf7; --c-ann: #f0a8a2; --accent-fg: #0b1220; --tint: rgba(141, 184, 234, .12); --warm: #ecbf6c; --stamp: #f0a095;
      --st-have: #223a2e; --st-buy: #3f3520; --st-rent: #22364a; --danger: #c9443f; --f-white: #cfd4dc;
      --glass: rgba(24, 30, 42, .6); --glass2: rgba(44, 54, 72, .5); --glass-b: rgba(255, 255, 255, .14); --glass-sh: 0 12px 36px rgba(0, 0, 0, .5); --glass-hi: rgba(255, 255, 255, .1);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #12161d; --ink: #e9edf4; --muted: #aab3c3; --line: #343c4c; --line2: #4d586c;
    --accent: #a6cdf7; --c-ann: #f0a8a2; --accent-fg: #0b1220; --tint: rgba(141, 184, 234, .12); --warm: #ecbf6c; --stamp: #f0a095;
    --st-have: #223a2e; --st-buy: #3f3520; --st-rent: #22364a; --danger: #c9443f; --f-white: #cfd4dc;
      --glass: rgba(24, 30, 42, .6); --glass2: rgba(44, 54, 72, .5); --glass-b: rgba(255, 255, 255, .14); --glass-sh: 0 12px 36px rgba(0, 0, 0, .5); --glass-hi: rgba(255, 255, 255, .1);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--serif); font-size: 18px; font-weight: 400; line-height: 1.4;
    padding-block: 0 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 10; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1, h2, h3, h4, p, ul { margin: 0; }
  button, select, input, textarea { font-family: inherit; }
  :focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); text-underline-offset: 3px; }

  nav.index { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8); border-bottom: 1px solid var(--glass-b); padding: 8px 0; }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { nav.index { background: var(--paper); } .gd-menu, .gd-btn { background: var(--paper) !important; } }
  .gd { position: relative; display: flex; justify-content: flex-start; }
  .gd-btn { display: inline-flex; align-items: baseline; gap: 10px; cursor: pointer; color: var(--ink); font-size: 19px; font-weight: 500; line-height: 1.1; padding: 7px 14px 7px 18px; border-radius: 999px; background: var(--glass2); border: 1px solid var(--glass-b); -webkit-backdrop-filter: blur(16px) saturate(1.6); backdrop-filter: blur(16px) saturate(1.6); box-shadow: inset 0 1px 0 var(--glass-hi), 0 2px 10px rgba(30, 45, 80, .08); }
  .gd-wrap { position: relative; display: inline-block; }
  .nsel { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; font-size: 16px; border: 0; z-index: 2; }
  .nsel-box { position: relative; display: inline-block; max-width: 100%; }
  .nsel:focus-visible ~ .gd-btn, .nsel:focus-visible ~ .gd-h { outline: 1.5px solid var(--accent); outline-offset: 2px; }
  /* En ordenador (ratón), los desplegables propios; en móvil y tableta, los del sistema */
  @media (hover: hover) and (pointer: fine) { .nsel { display: none; } }
  @media not ((hover: hover) and (pointer: fine)) { .gd-menu { display: none !important; } }
  .gd-h { font-size: clamp(31px, 9vw, 38px) !important; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .gd-h .gd-chev { width: 14px; height: 14px; margin-top: 4px; }
  .gd-h[aria-expanded="true"] .gd-chev { transform: rotate(180deg); }
  .gd-btn small { font-size: 13px; font-style: italic; font-weight: 400; color: var(--muted); }
  .gd-chev { width: 11px; height: 11px; align-self: center; fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease; }
  .gd-btn[aria-expanded="true"] .gd-chev { transform: rotate(180deg); }
  .gd-menu { position: absolute; top: calc(100% + 6px); left: 0; width: min(340px, calc(100vw - 32px)); padding: 6px; border-radius: 18px; background: color-mix(in srgb, var(--paper) 80%, transparent); -webkit-backdrop-filter: blur(28px) saturate(1.9); backdrop-filter: blur(28px) saturate(1.9); border: 1px solid var(--glass-b); box-shadow: inset 0 1px 0 var(--glass-hi), var(--glass-sh); z-index: 40; }
  .gd-it { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: 100%; border: 0; background: transparent; color: var(--ink); text-align: left; font-size: 19px; padding: 10px 14px; border-radius: 12px; cursor: pointer; }
  .gd-it small { font-size: 13.5px; font-style: italic; color: var(--muted); }
  .gd-it:hover { background: rgba(127, 140, 160, .14); }
  .gd-it[aria-current="true"] { background: var(--tint); color: var(--accent); }
  .bsum { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 3px; margin: 8px 0 12px; }
  .bsum div { text-align: center; padding: 8px 4px; min-width: 0; }
  .bsum div + div { border-left: 1px solid var(--line); }
  .bsum b { display: block; font-size: 20px; font-weight: 500; line-height: 1.1; white-space: nowrap; font-variant-numeric: lining-nums; }
  .bsum span { font-size: 14px; color: var(--muted); font-style: italic; }
  .bhead, .brow, .bsub { display: grid; grid-template-columns: minmax(0, 1fr) 92px 92px; gap: 8px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .bhead { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; padding-bottom: 4px; border-bottom-color: var(--line2); }
  .bhead span:nth-child(n+2), .bsub span:nth-child(n+2) { text-align: right; }
  .bnm { background: none; border: 0; padding: 0; font: inherit; font-size: 18px; line-height: 1.2; text-align: left; color: var(--ink); cursor: text; }
  .bamt { background: none; border: 0; padding: 0; font: inherit; font-size: 17px; text-align: right; color: var(--ink); cursor: text; white-space: nowrap; font-variant-numeric: lining-nums; }
  .bamt.z { color: var(--muted); }
  .bin { font: inherit; font-size: 17px; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--accent); border-radius: 0; width: 100%; min-width: 0; padding: 2px 0; text-align: right; outline: none; }
  .bin.bn { text-align: left; font-size: 18px; }
  .bsub { font-weight: 600; border-top: 1px solid var(--line2); border-bottom: 0; font-size: 18px; }
  .bsub span:first-child { font-style: italic; font-weight: 500; }
  .bsub.big { font-size: 20px; color: var(--accent); }
  .bsub.real { color: var(--c-ann); border-top: 0; padding-top: 0; }
  ul.blist { list-style: none; padding: 0; }
  .mp-sb { fill: none; stroke: var(--ink); stroke-width: 1.2; }
  .map text.mp-sbt { font-size: 10px; fill: var(--ink); text-anchor: middle; stroke: none; }

  .index .row { display: grid; grid-template-columns: repeat(4, 1fr); }
  .itab { border: 0; background: transparent; cursor: pointer; min-width: 0; text-align: center; padding: 8px 2px 8px; color: var(--muted); font-size: 18px; font-weight: 500; line-height: 1.1; }
  .itab small { display: block; font-size: 13px; font-weight: 400; font-style: italic; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .itab[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -1.5px 0 var(--accent); }

  .topbar { display: flex; align-items: center; gap: 8px; margin: -8px 0 14px; min-height: 28px; }
  .topbar .sync { order: 1; } .topbar .who { order: 2; } .topbar .themebtn { order: 3; }
  .topbar .who { flex: none; position: relative; margin: 0; }
  .who-btn { font-size: 16px; padding: 4px 10px 4px 13px; gap: 6px; font-style: normal; }
  .who-menu { left: auto; right: 0; width: 180px; }
  .who-menu .gd-it { font-size: 18px; padding: 8px 12px; font-style: normal; }
  .who { flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0; font-size: 15px; font-style: italic; color: var(--muted); }
  .sync { margin-left: auto; font-size: 13px; font-style: italic; color: var(--muted); white-space: nowrap; }
  .sync.live::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-right: 5px; transform: translateY(-1px); }
  .juntos { font-style: italic; color: var(--c-ann); }
  .themebtn { margin-left: 0; width: 28px; height: 28px; padding: 0; display: inline-grid; place-items: center; background: transparent; border: 0; border-radius: 50%; color: var(--muted); cursor: pointer; }
  .themebtn:hover { color: var(--ink); }
  .themebtn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .who .pill { font-size: 15px; padding: 1px 10px; font-style: normal; }
  .sheet { padding: 22px 0 28px; min-height: 60vh; }
  .page-head { padding-bottom: 4px; }
  svg.flags { display: block; width: 100%; height: auto; overflow: visible; margin-bottom: 10px; opacity: .9; }
  .page-head .gd-wrap + svg.flags, .page-head .quote + svg.flags { margin-top: 14px; }
  h1 { font-size: clamp(34px, 10vw, 46px); font-weight: 500; font-style: italic; letter-spacing: -.01em; line-height: 1.02; }
  .hand { display: block; font-style: italic; font-size: 18px; line-height: 1.3; color: var(--muted); margin-top: 6px; }
  h2.sec { font-size: 14px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 30px 0 12px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
  .lbl { font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .muted { color: var(--muted); }

  .scrap { border: 1px solid var(--line); padding: 14px 14px 13px; margin: 12px 0; border-radius: 2px; background: transparent; }
  .scrap h3 { font-size: 19px; font-weight: 600; margin-bottom: 3px; }
  .scrap p + p { margin-top: 8px; }
  .scrap p, .scrap li { text-wrap: pretty; }
  .tape::before { display: none; }
  .scrap ul.plain { list-style: none; padding: 0; display: grid; gap: 6px; }
  .scrap ul.plain li { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; align-items: baseline; }
  .scrap ul.plain b { font-style: italic; font-weight: 500; color: var(--accent); }

  .ticket { --stub: 88px; display: grid; grid-template-columns: minmax(0, 1fr) var(--stub); border: 1px solid var(--line2); margin: 16px 0 4px; border-radius: 3px; }
  .t-main { padding: 12px 12px 11px 14px; min-width: 0; }
  .t-route { display: grid; grid-template-columns: auto minmax(20px, 1fr) auto; gap: 8px; align-items: center; margin-top: 4px; }
  .t-code { font-size: 32px; font-weight: 500; line-height: 1; letter-spacing: .03em; }
  .t-time { display: block; font-size: 19px; font-variant-numeric: lining-nums tabular-nums; }
  .t-time em { font-size: 13px; color: var(--warm); font-style: italic; }
  .t-city { display: block; font-size: 14px; color: var(--muted); font-style: italic; }
  .t-arrow { height: 1px; background: var(--line2); position: relative; }
  .t-arrow::after { content: ""; position: absolute; right: 0; top: -3.5px; border: 4px solid transparent; border-left: 6px solid var(--line2); }
  .t-stub { border-left: 1px dashed var(--line2); padding: 12px 6px; display: grid; align-content: center; justify-items: center; text-align: center; gap: 1px; }
  .t-stub b { font-size: 28px; line-height: 1; font-weight: 500; color: var(--accent); }
  .t-stub span { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .t-stub i { font-size: 14px; margin-top: 6px; }
  .t-note { margin: 6px 2px 0; }
  .t-between { text-align: center; margin: 12px 0 0; }

  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 6px; }
  .pill { border: 1px solid var(--line2); background: transparent; color: var(--muted); cursor: pointer; border-radius: 999px; padding: 3px 12px; font-size: 17px; line-height: 1.25; }
  .pill[aria-pressed="true"] { border-color: var(--accent); background: var(--tint); color: var(--accent); }
  .pill small { font-size: 14px; font-style: italic; opacity: .85; margin-left: 4px; }

  .dayhead { margin: 14px 0 2px; }
  .dayhead h2 { font-size: 28px; font-weight: 500; font-style: italic; line-height: 1.08; text-wrap: balance; }
  section.blk { margin-top: 20px; }
  .eyebrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  .eyebrow h3 { font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .eyebrow span { font-size: 16px; font-style: italic; color: var(--muted); }
  ul.items { list-style: none; padding: 0; }
  .item label { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 9px 0; cursor: pointer; align-items: start; border-bottom: 1px solid var(--line); }
  ul.items li:last-child label { border-bottom: 0; }
  .item input[type="checkbox"] { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--accent); cursor: pointer; }
  .item .t { display: block; font-weight: 600; font-size: 19px; line-height: 1.2; }
  .item .tip { display: block; color: var(--muted); font-size: 17.5px; margin-top: 2px; text-wrap: pretty; }
  .item.done .t { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--muted); }
  .item.done .tip { opacity: .7; }

  .fx { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .fx label { display: block; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .fx input { width: 100%; margin-top: 3px; font-size: 20px; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--line2); padding: 4px 2px; border-radius: 0; font-variant-numeric: lining-nums tabular-nums; }
  .fx-out { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-top: 8px; }
  .fx-out b { font-size: 26px; font-weight: 500; font-variant-numeric: lining-nums tabular-nums; }
  .picks { display: grid; gap: 8px; margin-top: 10px; }
  .pick { text-align: left; cursor: pointer; color: var(--ink); background: transparent; border: 1px solid var(--line2); border-radius: 3px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .pick strong { display: block; font-size: 19px; font-weight: 500; line-height: 1.2; }
  .pick small { display: block; color: var(--muted); font-size: 17px; font-style: italic; }
  .pick .st { font-size: 15px; font-style: italic; color: var(--muted); }
  [hidden] { display: none !important; }
  .pick.last { border-color: var(--accent); }
  .choice { display: grid; gap: 8px; }
  .pick[aria-pressed="true"] { border-color: var(--accent); background: var(--tint); }
  .pick[aria-pressed="true"] .st { color: var(--accent); }
  .free { margin: 8px 0; padding: 12px 14px; border: 1px dashed var(--line2); color: var(--muted); font-style: italic; }
  .note { margin-top: 26px; }
  textarea.ruled { width: 100%; min-height: 124px; resize: vertical; color: var(--ink); font-size: 18px; line-height: 30px; background-color: transparent; background-image: repeating-linear-gradient(transparent 0 29px, var(--line) 29px 30px); background-attachment: local; border: 0; border-top: 1px solid var(--line); padding: 0 2px; }
  textarea.ruled::placeholder { font-style: italic; color: var(--muted); }

  .meter { display: flex; align-items: center; gap: 12px; margin: 10px 0 12px; }
  .bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
  .meter b { font-size: 17px; font-weight: 500; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
  .tally { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 3px; margin: 6px 0 12px; }
  .tally div { text-align: center; padding: 7px 4px; }
  .tally div + div { border-left: 1px solid var(--line); }
  .tally b { display: block; font-size: 26px; font-weight: 500; line-height: 1; font-variant-numeric: lining-nums; }
  .tally span { font-size: 14px; color: var(--muted); font-style: italic; }
  .cat { margin-top: 24px; }
  .cat > h3 { font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 600; padding-bottom: 4px; border-bottom: 1px solid var(--line2); }
  .cat > h3 small { font-weight: 400; font-style: italic; letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: 8px; font-size: 14px; }
  .cat ul { list-style: none; padding: 0; }
  .lwrap { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
  .lrow { position: relative; z-index: 1; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto 22px; gap: 3px 10px; padding: 9px 0; align-items: start; background: var(--paper); touch-action: pan-y; transition: transform .22s ease; will-change: transform; }
  .grip { grid-column: 4; grid-row: 1; align-self: center; display: grid; place-items: center; width: 22px; height: 30px; margin: -4px 0; color: var(--muted); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; opacity: .55; }
  .grip svg { width: 12px; height: 18px; fill: currentColor; }
  .grip:hover { opacity: 1; }
  .lwrap.moving { z-index: 5; box-shadow: 0 6px 20px rgba(20, 30, 50, .18); border-radius: 4px; overflow: visible; }
  .lwrap.moving .lrow { background: var(--paper); outline: 1.5px solid var(--accent); outline-offset: 0; border-radius: 4px; }
  .lwrap.moving .grip { cursor: grabbing; opacity: 1; color: var(--accent); }
  body.reordering, body.reordering * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }
  .cat ul:empty { min-height: 34px; }
  .lrow.drag { transition: none; user-select: none; -webkit-user-select: none; }

  function openRow(wrap) {

  }

    var it = itemById(id);

  view.addEventListener("pointerdown", function (e) {
    var inner = e.target.closest(".lrow");
    if (!inner || e.target.closest(".led") || e.target.closest(".grip") || (e.pointerType === "mouse" && e.button !== 0)) return;
    var wrap = inner.parentNode;
    closeOthers(wrap);
    sw = { inner: inner, wrap: wrap, btn: wrap.querySelector(".sdel"), x0: e.clientX, y0: e.clientY, base: wrap.classList.contains("open") ? -OPEN : 0, W: wrap.offsetWidth, id: e.pointerId, dragging: false, x: 0 };
  });
  view.addEventListener("pointermove", function (e) {
    if (!sw || e.pointerId !== sw.id) return;
    var dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
    if (!sw.dragging) {
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        sw.dragging = true;
        sw.inner.classList.add("drag"); sw.wrap.classList.add("dragging");
        try { sw.inner.setPointerCapture(e.pointerId); } catch (err) {}
      } else if (Math.abs(dy) > 10) { sw = null; return; }
      else return;
    }
    var x = Math.min(0, Math.max(-sw.W, sw.base + dx));
    sw.x = x;
    sw.inner.style.transform = "translateX(" + x + "px)";
    sw.btn.style.width = Math.max(OPEN, -x) + "px";
    e.preventDefault();
  });
  function endSwipe(e) {
    if (!sw || e.pointerId !== sw.id) return;
    var s = sw; sw = null;
    if (!s.dragging) return;
    s.inner.classList.remove("drag"); s.wrap.classList.remove("dragging");
    suppress = true; setTimeout(function () { suppress = false; }, 60);

  }
  view.addEventListener("pointerup", endSwipe);
  /* Reordenar arrastrando el asa */
  var mv = null;
  function mvScroll() {
    if (!mv) return;

    if (v) { window.scrollBy(0, v); mvPlace(); }
    mv.raf = requestAnimationFrame(mvScroll);
  }
  function mvPlace() {
    var li = mv.li, x = mv.x, y = mv.y;
    li.style.visibility = "hidden";
    var el = document.elementFromPoint(Math.min(Math.max(x, 4), window.innerWidth - 4), y);

      else if (tli.nextElementSibling !== li) tli.parentNode.insertBefore(li, tli.nextElementSibling);

    }

  view.addEventListener("pointerdown", function (e) {

  var SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>';
